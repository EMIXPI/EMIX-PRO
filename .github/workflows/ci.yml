# .github/workflows/ci.yml — EMIX-PRO CI
# هر push/PR روی main: اجرای کل سوئیت تست (رگرسیون + فازهای ۴۵–۴۸).
# خود دیپلوی Railway از GitHub↔Railway integration (connected branch: main)
# انجام می‌شود — این workflow فقط گیتِ کیفیت قبل از دیپلوی است.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Node (JS syntax gate)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run full test suite
        env:
          ADMIN_PASSWORD: "123456"
        run: python -m pytest tests/ -q
